<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathias Hole - Contacto & Perfiles</title>
    <style>
        /* Estilos Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor de Particles.js */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Tarjeta Principal */
        .profile-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 360px;
            padding: 30px 24px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }

        /* Identidad */
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #30363d;
            margin-bottom: 16px;
            object-fit: cover;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 4px;
        }
        p.subtitle {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 28px;
        }

        /* Botones de Enlaces */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: transform 0.2s ease, filter 0.2s ease;
            color: #ffffff;
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn:active {
            transform: translateY(0);
        }

        /* Colores Personalizados */
        .btn-email {
            background-color: #238636;
        }
        .btn-github {
            background-color: #24292e;
            border: 1px solid #30363d;
        }
        .btn-orcid {
            background-color: #a6ce39;
            color: #333333;
        }

        /* Iconos SVG */
        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Fondo de Partículas -->
    <div id="particles-js"></div>

    <!-- Tarjeta de Contenido -->
    <div class="profile-card">
        <img class="avatar" src="https://github.com/mathiashole.png" alt="Mathias Hole">
        
        <h1>Mathias Hole</h1>
        <p class="subtitle">Contacto & Portafolio Académico</p>

        <div class="links-container">
            <!-- BOTÓN: EMAIL -->
            <a href="mailto:mangino@fcien.com.uy" class="btn btn-email">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                Enviar Correo
            </a>

            <!-- BOTÓN: GITHUB -->
            <a href="https://github.com/mathiashole" target="_blank" rel="noopener noreferrer" class="btn btn-github">
                <svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.35-2.22-.25-4.55-1.11-4.55-4.94 0-1.1.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.65.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
                Perfil GitHub
            </a>

            <!-- BOTÓN: ORCID -->
            <a href="https://orcid.org/0009-0005-3896-9268" target="_blank" rel="noopener noreferrer" class="btn btn-orcid">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-3.6 15H7.2V7h1.2v10zm-.6-11.2c-.4 0-.7-.3-.7-.7s.3-.7.7-.7.7.3.7.7-.3.7-.7.7zm7.7 7.7c-.5.7-1.2 1.1-2.1 1.1h-2.3V7h2.3c.9 0 1.6.4 2.1 1.1.4.6.6 1.4.6 2.4s-.2 1.8-.6 2.4zm-1.1-3.9c-.2-.4-.6-.6-1.1-.6h-1.1v4.2h1.1c.5 0 .9-.2 1.1-.6.2-.4.3-1 .3-1.5s-.1-1.1-.3-1.5z"/></svg>
                Perfil ORCID
            </a>
        </div>
    </div>

    <!-- Librería Particles.js vía CDN -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <!-- Configuración de Partículas -->
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { 
                    "value": 50, 
                    "density": { "enable": true, "value_area": 800 } 
                },
                "color": { "value": "#8b949e" },
                "shape": { "type": "circle" },
                "opacity": { 
                    "value": 0.4, 
                    "random": true 
                },
                "size": { 
                    "value": 3, 
                    "random": true 
                },
                "line_linked": { 
                    "enable": true, 
                    "distance": 150, 
                    "color": "#30363d", 
                    "opacity": 0.4, 
                    "width": 1 
                },
                "move": { 
                    "enable": true, 
                    "speed": 1.5, 
                    "direction": "none", 
                    "random": false, 
                    "straight": false, 
                    "out_mode": "out" 
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { 
                    "onhover": { "enable": true, "mode": "repulse" }, 
                    "onclick": { "enable": true, "mode": "push" } 
                },
                "modes": {
                    "repulse": { "distance": 100, "duration": 0.4 },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
